<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b2e">
<title>动物城睡前故事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/common.css">
<style>
#home{
  justify-content:flex-start;align-items:center;text-align:center;
  padding:11vh 8vw 8vh;background:var(--night-1);
}
.series-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(26px,7.6vw,34px);letter-spacing:.14em;text-indent:.14em;color:var(--cream);
}
.series-sub{margin-top:16px;color:var(--cream-dim);font-size:13px;letter-spacing:.3em}
.nights{margin-top:26px;color:#8d92ab;font-size:12px;letter-spacing:.4em}

.bld-home{position:relative;z-index:2;width:min(80vw,380px);margin-top:5vh}
.bld-home svg{width:100%;height:auto;display:block}

/* 故事之窗 */
.storywin{cursor:pointer}
.storywin .halo{opacity:0;transition:opacity .9s ease}
.storywin .glass{fill:#242a45;transition:fill .9s ease}
.storywin .umb{fill:#ece5d3;opacity:.9;transition:fill .9s ease}
.storywin .rains{opacity:.7;transition:opacity .9s ease}
.storywin.lit .halo{opacity:.85}
.storywin.lit .glass{fill:var(--amber-soft)}
.storywin.lit .umb{fill:#6b5747}
.storywin.lit .rains{opacity:.25}
/* 未来的圆窗 */
.futurewin{cursor:pointer}
.futurewin .dot{fill:#4a5378;transition:fill .4s ease}
.futurewin:active .dot{fill:#8d92ab}

.home-hint{margin-top:5vh;color:var(--cream-dim);font-size:13px;letter-spacing:.36em}
.home-hint b{font-weight:400;color:var(--amber);animation:hintp 2.6s ease-in-out infinite}
@keyframes hintp{0%,100%{opacity:.5}50%{opacity:1}}
.home-foot{margin-top:7vh;color:#6f7488;font-size:11px;letter-spacing:.3em}

#toast{
  position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
  z-index:30;padding:12px 22px;border-radius:10px;
  background:rgba(236,229,211,.94);color:#4a4130;
  font-size:13px;letter-spacing:.24em;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="vignette"></div>
<button id="sndBtn" aria-label="声音开关">声音</button>
<div id="toast">下一夜，正在来的路上</div>

<main>
<section id="home" class="scene">
  <div class="reveal">
    <div class="series-title">动物城睡前故事</div>
    <div class="series-sub">每 一 夜 · 一 个 小 故 事</div>
    <div class="nights" id="nights">第 一 夜 ，还 没 点 灯</div>
  </div>

  <div class="bld-home reveal" style="--d:.25s">
    <svg viewBox="0 0 380 520" aria-label="故事小楼，每扇窗是一个故事">
      <defs>
        <filter id="hglow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>
      <!-- 月亮与星星 -->
      <circle cx="72" cy="86" r="30" fill="#d8d9e8" opacity=".07"/>
      <circle cx="72" cy="86" r="20" fill="#d8d9e8" opacity=".13"/>
      <circle cx="72" cy="86" r="13" fill="#d8d9e8" opacity=".24"/>
      <g fill="#fff">
        <circle cx="140" cy="60" r="1.4" opacity=".6"/>
        <circle cx="240" cy="44" r="1.2" opacity=".5"/>
        <circle cx="316" cy="76" r="1.5" opacity=".65"/>
        <circle cx="200" cy="110" r="1.1" opacity=".45"/>
        <circle cx="350" cy="140" r="1.2" opacity=".5"/>
      </g>
      <!-- 远层天际线 -->
      <g fill="#1a2036">
        <rect x="0" y="330" width="52" height="190" rx="2"/>
        <rect x="336" y="314" width="44" height="206" rx="2"/>
        <rect x="52" y="376" width="34" height="144" rx="2"/>
        <rect x="298" y="368" width="38" height="152" rx="2"/>
      </g>
      <!-- 近层侧楼 -->
      <g fill="#141829">
        <rect x="0" y="392" width="60" height="128"/>
        <rect x="330" y="404" width="50" height="116"/>
      </g>
      <g fill="#f4b860">
        <rect class="winlit" x="14" y="412" width="7" height="9" rx="1"/>
        <rect class="winlit" x="34" y="442" width="7" height="9" rx="1"/>
        <rect class="winlit" x="344" y="428" width="7" height="9" rx="1"/>
      </g>
      <!-- 主楼 -->
      <rect x="108" y="200" width="164" height="270" rx="10" fill="#1c2135"/>
      <rect x="100" y="190" width="180" height="14" rx="6" fill="#232a47"/>
      <!-- 楼顶上的两个小家伙 -->
      <g>
        <circle cx="150" cy="150" r="2.4" fill="#fff" opacity=".7"/>
        <circle cx="248" cy="140" r="2" fill="#fff" opacity=".55"/>
        <!-- 朱迪 -->
        <g>
          <g transform="rotate(-7 178 158)">
            <ellipse cx="178" cy="158" rx="3.2" ry="10" fill="#A6ABBB"/>
            <ellipse cx="178" cy="160" rx="1.7" ry="6.5" fill="#E9BCCF"/>
          </g>
          <g transform="rotate(7 190 158)">
            <ellipse cx="190" cy="158" rx="3.2" ry="10" fill="#A6ABBB"/>
            <ellipse cx="190" cy="160" rx="1.7" ry="6.5" fill="#E9BCCF"/>
          </g>
          <circle cx="184" cy="172" r="7.5" fill="#A6ABBB"/>
          <ellipse cx="184" cy="186" rx="9.5" ry="10" fill="#2B3556"/>
        </g>
        <!-- 尼克 -->
        <g>
          <g transform="rotate(-14 204 157)">
            <ellipse cx="204" cy="157" rx="3.6" ry="9" fill="#DB6E38"/>
            <ellipse cx="203.5" cy="150" rx="2.9" ry="2.6" fill="#4A2C1C"/>
          </g>
          <g transform="rotate(14 218 157)">
            <ellipse cx="218" cy="157" rx="3.6" ry="9" fill="#DB6E38"/>
            <ellipse cx="218.5" cy="150" rx="2.9" ry="2.6" fill="#4A2C1C"/>
          </g>
          <circle cx="211" cy="174" r="8.5" fill="#DB6E38"/>
          <ellipse cx="213" cy="188" rx="11" ry="10.5" fill="#B3C28E"/>
          <path d="M226 190 Q244 188 250 176 Q254 188 246 195 Q234 199 222 193 Z" fill="#DB6E38"/>
          <ellipse cx="248" cy="178" rx="5" ry="4.5" fill="#F2E3C8"/>
        </g>
      </g>
      <!-- 二楼：第二夜的故事之窗 + 未来的圆窗 -->
      <g class="storywin" id="trainwin" role="link" aria-label="第二夜 · 慢一点的火车">
        <rect class="halo" x="140" y="230" width="64" height="84" rx="8" fill="#ffcf7e" filter="url(#hglow)"/>
        <rect class="glass" x="145" y="235" width="54" height="74" rx="5"/>
        <!-- 小火车 -->
        <g fill="#ece5d3" opacity=".92">
          <rect x="154" y="272" width="38" height="14" rx="4"/>
          <path d="M154 272 L158 258 L170 258 L170 272 Z"/>
          <rect x="163" y="252" width="5" height="7" rx="1.5"/>
          <circle cx="162" cy="289" r="3.2"/>
          <circle cx="171" cy="289" r="3.2"/>
          <circle cx="182" cy="289" r="3.2"/>
          <circle cx="166" cy="247" r="2.4" opacity=".55"/>
          <circle cx="171" cy="241" r="3" opacity=".35"/>
        </g>
        <rect x="160" y="262" width="8" height="6" rx="1.5" fill="#3a4266"/>
      </g>
      <g class="futurewin" id="futurewin">
        <circle cx="233" cy="272" r="24" fill="#20263f"/>
        <circle cx="233" cy="272" r="20" fill="#242a45"/>
        <circle cx="233" cy="272" r="20" fill="none" stroke="#2a3149" stroke-width="3.5"/>
        <!-- 一弯月牙和一颗小星 -->
        <path class="dot" d="M237 262 a10.5 10.5 0 1 0 6.5 17 a8.5 8.5 0 0 1 -6.5 -17 Z" fill="#8d92ab"/>
        <path class="dot" d="M225 269 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2 Z" fill="#8d92ab"/>
      </g>
      <!-- 一楼：第一夜的故事之窗 -->
      <g class="storywin" id="rainwin" role="link" aria-label="第一夜 · 动物城的雨">
        <rect class="halo" x="139" y="324" width="86" height="108" rx="10" fill="#ffcf7e" filter="url(#hglow)"/>
        <rect class="glass" x="145" y="330" width="74" height="96" rx="6"/>
        <g class="rains" stroke="#8fa0c8" stroke-width="1.8" stroke-linecap="round">
          <line x1="164" y1="348" x2="161" y2="357"/>
          <line x1="194" y1="344" x2="191" y2="353"/>
          <line x1="210" y1="350" x2="207" y2="359"/>
        </g>
        <path class="umb" d="M167 376 a14 14 0 0 1 28 0 Z"/>
        <line x1="180.5" y1="376" x2="180.5" y2="394" stroke="#8d8577" stroke-width="2"/>
      </g>
      <!-- 门 -->
      <rect x="165" y="424" width="50" height="46" rx="6" fill="#161b2c"/>
      <rect x="175" y="432" width="30" height="38" rx="4" fill="#2a3149"/>
      <circle cx="199" cy="456" r="2" fill="#f4b860" opacity=".85"/>
      <!-- 地面 -->
      <rect x="0" y="470" width="380" height="50" fill="#12161f"/>
    </svg>
  </div>

  <div class="home-hint reveal" style="--d:.5s"><b>点一扇窗</b>，进去躲一会儿</div>
  <div class="home-foot reveal" style="--d:.7s">这栋楼，会随着故事慢慢长高 · FOR LIN, BY ZHE</div>
</section>
</main>

<script src="assets/story.js"></script>
<script>
/* 故事清单：以后每加一夜，在这里登记一扇窗 */
var STORIES=[
  {id:"rain",url:"rain/",win:document.getElementById("rainwin")},
  {id:"train",url:"train/",win:document.getElementById("trainwin")}
];

/* 已读的窗，进来就是亮的 */
var nRead=0;
STORIES.forEach(function(s){
  if(ZStory.isRead(s.id)){s.win.classList.add("lit");nRead++;}
});
var nightsEl=document.getElementById("nights");
if(nRead>0){
  nightsEl.textContent=nRead===1?"已 陪 你 度 过 1 个 夜 晚":"已 陪 你 度 过 "+nRead+" 个 夜 晚";
}else{
  nightsEl.textContent="窗 还 暗 着 ，点 一 扇 试 试";
}

/* 点窗进入：先亮灯，再走进去 */
STORIES.forEach(function(s){
  s.win.addEventListener("pointerdown",function(){
    s.win.classList.add("lit");
    try{sessionStorage.setItem("zs_seen","1");}catch(e){}
    setTimeout(function(){location.href=s.url;},700);
  });
});

/* 未来的圆窗 */
var toast=document.getElementById("toast"),toastTimer=null;
document.getElementById("futurewin").addEventListener("pointerdown",function(){
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2200);
});

ZStory.init({
  audio:{
    tempo:4200, delayTime:.46, feedback:.32, wetness:.5, volume:.8,
    chords:[
      {bass:110.00,notes:[164.81,220.00,277.18,329.63],spark:[440.00,554.37]},
      {bass:92.50, notes:[138.59,185.00,220.00,277.18],spark:[440.00,369.99]},
      {bass:146.83,notes:[220.00,293.66,369.99,440.00],spark:[587.33,440.00]},
      {bass:164.81,notes:[246.94,329.63,415.30,493.88],spark:[659.25,554.37]}
    ]
  }
});
</script>
</body>
</html>
