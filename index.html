<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b2e">
<title>动物城睡前故事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/common.css">
<style>
#home{
  justify-content:flex-start;align-items:center;text-align:center;
  padding:11vh 8vw 8vh;background:var(--night-1);
}
.series-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(26px,7.6vw,34px);letter-spacing:.14em;text-indent:.14em;color:var(--cream);
}
.series-sub{margin-top:16px;color:var(--cream-dim);font-size:13px;letter-spacing:.3em}
.nights{margin-top:26px;color:#8d92ab;font-size:12px;letter-spacing:.4em}

.bld-home{position:relative;z-index:2;width:min(94vw,430px);margin-top:5vh}
.bld-home svg{width:100%;height:auto;display:block}

/* 故事之窗 */
.storywin{cursor:pointer}
.storywin .halo{opacity:0;transition:opacity .9s ease}
.storywin .glass{fill:#242a45;transition:fill .9s ease}
.storywin.lit .halo{opacity:.85}
.storywin.lit .glass{fill:var(--amber-soft)}
/* 未来的虚线小房 */
.futurewin{cursor:pointer}
.futurewin .dot{fill:#7d84a0;transition:fill .4s ease}
.futurewin:active .dot{fill:#c9cfdd}

.home-hint{margin-top:5vh;color:var(--cream-dim);font-size:13px;letter-spacing:.36em}
.home-hint b{font-weight:400;color:var(--amber);animation:hintp 2.6s ease-in-out infinite}
@keyframes hintp{0%,100%{opacity:.5}50%{opacity:1}}
.home-foot{margin-top:7vh;color:#6f7488;font-size:11px;letter-spacing:.24em;line-height:2.1}
.home-foot .en{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.3em;opacity:.75}

#toast{
  position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
  z-index:30;padding:12px 22px;border-radius:10px;
  background:rgba(236,229,211,.94);color:#4a4130;
  font-size:13px;letter-spacing:.24em;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="vignette"></div>
<button id="sndBtn" aria-label="声音开关">声音</button>
<div id="toast">下一夜，正在来的路上</div>

<main>
<section id="home" class="scene">
  <div class="reveal">
    <div class="series-title">动物城睡前故事</div>
    <div class="series-sub">每 一 夜 · 一 个 小 故 事</div>
    <div class="nights" id="nights">窗 还 暗 着 ，点 一 扇 试 试</div>
  </div>

  <div class="bld-home reveal" style="--d:.25s">
    <svg id="street" viewBox="0 0 380 700" preserveAspectRatio="xMidYMin meet" aria-label="故事小街，每座小房子是一个故事"></svg>
  </div>

  <div class="home-hint reveal" style="--d:.5s"><b>点一扇窗</b>，进去躲一会儿</div>
  <div class="home-foot reveal" style="--d:.7s">这条街，会随着故事慢慢热闹<span class="en">FOR LIN, BY ZHE</span></div>
</section>
</main>

<script src="assets/story.js"></script>
<script>
/* ============================================================
   故事小街：每行两座房子。
   奇数个故事 → 末行 = 最新故事 + 虚线小房（敬请期待）
   偶数个故事 → 末行 = 虚线小房 + 小树
   任何数量，每一行都是满的。以后加故事，只需往 STORIES 里加一行。
   ============================================================ */
var MOTIF={
  rain:'<g fill="#ece5d3" opacity=".92"><path d="M13 24 a12 12 0 0 1 24 0 Z"/><rect x="24" y="24" width="2" height="11" rx="1" fill="#8d8577"/></g><g stroke="#8fa0c8" stroke-width="1.6" stroke-linecap="round" opacity=".7"><line x1="12" y1="8" x2="10" y2="14"/><line x1="38" y1="6" x2="36" y2="12"/></g>',
  train:'<g fill="#ece5d3" opacity=".92"><rect x="8" y="20" width="30" height="10" rx="3"/><path d="M8 20 L12 10 L22 10 L22 20 Z"/><rect x="17" y="4" width="4" height="7" rx="1.5"/><circle cx="15" cy="33" r="2.8"/><circle cx="23" cy="33" r="2.8"/><circle cx="33" cy="33" r="2.8"/></g>',
  weather:'<circle cx="16" cy="13" r="8" fill="#f4b860" opacity=".9"/><circle cx="16" cy="13" r="12" fill="#f4b860" opacity=".18"/><ellipse cx="32" cy="24" rx="12" ry="7" fill="#ece5d3" opacity=".9"/><ellipse cx="20" cy="27" rx="9" ry="5.5" fill="#ece5d3" opacity=".75"/>',
  rehearse:'<g fill="#ece5d3"><path d="M8 26 L40 8 L26 30 Z"/><path d="M26 30 L40 8 L30 32 Z" fill="#c9bfa5"/></g>',
  goodnight:'<path d="M28 6 a13 13 0 1 0 8 22 a10.5 10.5 0 0 1 -8 -22 Z" fill="#ece5d3" opacity=".92"/><circle cx="14" cy="26" r="1.8" fill="#ece5d3" opacity=".8"/>',
  evidence:'<g fill="none" stroke="#ece5d3" stroke-width="2.4" stroke-linecap="round"><circle cx="21" cy="16" r="8"/><line x1="27" y1="22" x2="35" y2="31"/></g>'
};

var STORIES=[
  {id:"rain",url:"rain/"},
  {id:"train",url:"train/"},
  {id:"weather",url:"weather/"},
  {id:"rehearse",url:"rehearse/"},
  {id:"goodnight",url:"goodnight/"},
  {id:"evidence",url:"evidence/"}
];

function houseSVG(x,y,i,motif,id){
  var roof=(i%2)?"#262e4d":"#232a47";
  var s="";
  s+='<path d="M'+x+' '+(y+40)+' L'+(x+75)+' '+(y+2)+' L'+(x+150)+' '+(y+40)+' Z" fill="'+roof+'"/>';
  s+='<rect x="'+(x+8)+'" y="'+(y+38)+'" width="134" height="84" rx="6" fill="#1c2135"/>';
  if(i%2===0)s+='<rect x="'+(x+104)+'" y="'+(y+12)+'" width="10" height="20" rx="2" fill="#1e2438"/><rect x="'+(x+101)+'" y="'+(y+10)+'" width="16" height="5" rx="2" fill="#1e2438"/>';
  s+='<g class="storywin" id="'+id+'">';
  s+='<rect class="halo" x="'+(x+41)+'" y="'+(y+48)+'" width="68" height="54" rx="7" fill="#ffcf7e" filter="url(#hglow)"/>';
  s+='<rect class="glass" x="'+(x+46)+'" y="'+(y+53)+'" width="58" height="44" rx="5"/>';
  s+='<g transform="translate('+(x+55)+','+(y+55)+')">'+motif+'</g>';
  s+='</g>';
  s+='<rect x="'+(x+61)+'" y="'+(y+98)+'" width="28" height="24" rx="3" fill="#161b2c"/><circle cx="'+(x+83)+'" cy="'+(y+110)+'" r="1.8" fill="#f4b860" opacity=".8"/>';
  s+='<circle cx="'+(x+22)+'" cy="'+(y+117)+'" r="7" fill="#2c4438"/><circle cx="'+(x+32)+'" cy="'+(y+120)+'" r="5" fill="#35503f"/>';
  return s;
}
function dashedSVG(x,y){
  var s="";
  s+='<path d="M'+x+' '+(y+40)+' L'+(x+75)+' '+(y+2)+' L'+(x+150)+' '+(y+40)+' Z" fill="none" stroke="#4a5378" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>';
  s+='<rect x="'+(x+8)+'" y="'+(y+38)+'" width="134" height="84" rx="6" fill="#161b2e" stroke="#4a5378" stroke-width="2.5" stroke-dasharray="5 5"/>';
  s+='<rect x="'+(x+46)+'" y="'+(y+53)+'" width="58" height="44" rx="5" fill="#242a45"/>';
  s+='<text x="'+(x+75)+'" y="'+(y+80)+'" text-anchor="middle" font-size="14" fill="#8d92ab" style="font-family:var(--serif)">Z z</text>';
  s+='<text x="'+(x+75)+'" y="'+(y+112)+'" text-anchor="middle" font-size="10" fill="#6f7488" letter-spacing="3" style="font-family:var(--sans)">敬请期待</text>';
  s+='<g class="futurewin" id="futurewin" style="cursor:pointer"><rect x="'+(x+4)+'" y="'+(y)+'" width="142" height="124" fill="transparent"/></g>';
  return s;
}
function treeSVG(x,y){
  var s="";
  s+='<rect x="'+(x+66)+'" y="'+(y+84)+'" width="9" height="38" rx="3" fill="#4a3a30"/>';
  s+='<circle cx="'+(x+70)+'" cy="'+(y+72)+'" r="20" fill="#35503f"/>';
  s+='<circle cx="'+(x+55)+'" cy="'+(y+82)+'" r="13" fill="#2c4438"/>';
  s+='<circle cx="'+(x+84)+'" cy="'+(y+84)+'" r="12" fill="#2c4438"/>';
  s+='<circle cx="'+(x+70)+'" cy="'+(y+66)+'" r="1.6" fill="#f4b860" opacity=".6"/>';
  return s;
}

(function buildStreet(){
  var street=document.getElementById("street");
  var items=[];
  STORIES.forEach(function(st,i){items.push({type:"story",i:i,st:st})});
  items.push({type:"dash"});
  if(items.length%2===1)items.push({type:"tree"});   /* 凑满整行 */

  var rows=Math.ceil(items.length/2);
  var H=44+rows*150+56;
  var s='<defs><filter id="hglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter></defs>';

  /* 月亮与星星 */
  s+='<path d="M62 78 a22 22 0 1 0 13.5 37 a17 17 0 0 1 -13.5 -37 Z" fill="#e8dfc8" opacity=".85"/>';
  s+='<g fill="#fff"><circle cx="150" cy="34" r="1.4" opacity=".6"/><circle cx="250" cy="52" r="1.2" opacity=".5"/><circle cx="320" cy="26" r="1.5" opacity=".6"/><circle cx="200" cy="70" r="1.1" opacity=".45"/></g>';

  items.forEach(function(it,k){
    var r=Math.floor(k/2),c=k%2;
    var x=25+c*180,y=44+r*150;
    if(it.type==="story")s+=houseSVG(x,y,it.i,MOTIF[it.st.id]||"",it.st.id+"win");
    else if(it.type==="dash")s+=dashedSVG(x,y);
    else s+=treeSVG(x,y);
  });

  /* 第一座屋顶上的两个小家伙 */
  s+='<g><circle cx="60" cy="30" r="2" fill="#fff" opacity=".6"/><circle cx="128" cy="22" r="1.7" fill="#fff" opacity=".5"/>'
    +'<g transform="rotate(-7 80 40)"><ellipse cx="80" cy="40" rx="3.2" ry="9.5" fill="#A6ABBB"/><ellipse cx="80" cy="42" rx="1.7" ry="6.5" fill="#E9BCCF"/></g>'
    +'<g transform="rotate(7 92 40)"><ellipse cx="92" cy="40" rx="3.2" ry="9.5" fill="#A6ABBB"/><ellipse cx="92" cy="42" rx="1.7" ry="6.5" fill="#E9BCCF"/></g>'
    +'<circle cx="86" cy="55" r="7" fill="#A6ABBB"/><ellipse cx="86" cy="68" rx="9" ry="9.5" fill="#2B3556"/>'
    +'<g transform="rotate(-14 106 39)"><ellipse cx="106" cy="39" rx="3.6" ry="8.5" fill="#DB6E38"/><ellipse cx="105.6" cy="32" rx="2.9" ry="2.6" fill="#4A2C1C"/></g>'
    +'<g transform="rotate(14 120 39)"><ellipse cx="120" cy="39" rx="3.6" ry="8.5" fill="#DB6E38"/><ellipse cx="120.4" cy="32" rx="2.9" ry="2.6" fill="#4A2C1C"/></g>'
    +'<circle cx="113" cy="56" r="8" fill="#DB6E38"/><ellipse cx="115" cy="70" rx="10.5" ry="9.5" fill="#B3C28E"/>'
    +'<path d="M127 72 Q141 68 145 57 Q149 68 140 76 Q130 80 122 75 Z" fill="#DB6E38"/><ellipse cx="144" cy="59" rx="4.6" ry="4.2" fill="#F2E3C8"/></g>';

  /* 街道地面 */
  s+='<rect x="0" y="'+(44+rows*150)+'" width="380" height="56" fill="#12161f"/>';
  s+='<rect x="0" y="'+(44+rows*150)+'" width="380" height="6" fill="#1a2036"/>';

  street.innerHTML=s;
  street.setAttribute("viewBox","0 0 380 "+H);
})();

/* 已读的窗亮着 */
var nRead=0;
STORIES.forEach(function(st){
  st.win=document.getElementById(st.id+"win");
  if(ZStory.isRead(st.id)){st.win.classList.add("lit");nRead++;}
});
var nightsEl=document.getElementById("nights");
if(nRead>0){
  nightsEl.textContent=nRead===1?"已 陪 你 度 过 1 个 夜 晚":"已 陪 你 度 过 "+nRead+" 个 夜 晚";
}else{
  nightsEl.textContent="窗 还 暗 着 ，点 一 扇 试 试";
}

/* 点窗进入 */
STORIES.forEach(function(st){
  st.win.addEventListener("pointerdown",function(){
    st.win.classList.add("lit");
    try{sessionStorage.setItem("zs_seen","1");}catch(e){}
    setTimeout(function(){location.href=st.url;},700);
  });
});

/* 敬请期待的小房 */
var toast=document.getElementById("toast"),toastTimer=null;
document.getElementById("futurewin").addEventListener("pointerdown",function(){
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2200);
});

ZStory.init({
  audio:{
    tempo:4200, delayTime:.46, feedback:.32, wetness:.5, volume:.8,
    chords:[
      {bass:110.00,notes:[164.81,220.00,277.18,329.63],spark:[440.00,554.37]},
      {bass:92.50, notes:[138.59,185.00,220.00,277.18],spark:[440.00,369.99]},
      {bass:146.83,notes:[220.00,293.66,369.99,440.00],spark:[587.33,440.00]},
      {bass:164.81,notes:[246.94,329.63,415.30,493.88],spark:[659.25,554.37]}
    ]
  }
});
</script>
</body>
</html>
